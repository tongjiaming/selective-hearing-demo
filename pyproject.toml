[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selective-hearing-demo"
version = "0.1.0"
description = "Local experimental two-speaker selective hearing demo"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
include = ["selective_hearing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
